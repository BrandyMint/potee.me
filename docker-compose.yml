# Local PostgreSQL only; the app itself runs natively (Ruby 3.4, Node).
# DB_PORT is allocated per checkout: DB_PORT="$(port-selector --name db)".
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: potee
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
