# FT-001 EVAL-01: reference plans for the real model. `today` pins relative
# dates; `expect` lists milestone dates the plan must contain. A run passes
# when every expected date is present and the plan has more than one project
# (unless `min_projects: 1`).
today: "2026-10-02"
plans:
  - name: course launch
    prompt: "Запускаю курс к 1 декабря. Лендинг до 20 октября, 3 вебинара по средам в ноябре в 19:00, рассылка за неделю до старта."
    expect: ["2026-10-20", "2026-11-04", "2026-11-11", "2026-11-18", "2026-11-24"]
  - name: moving house
    prompt: "Переезд в новую квартиру 15 ноября. До 1 ноября найти грузчиков, 10 ноября упаковать вещи, 20 ноября подключить интернет."
    expect: ["2026-11-01", "2026-11-10", "2026-11-15", "2026-11-20"]
  - name: kitchen renovation
    prompt: "Ремонт кухни: замер 12 октября, демонтаж с 19 по 23 октября, плитка с 26 октября по 6 ноября, установка кухни 13 ноября."
    expect: ["2026-10-12", "2026-10-19", "2026-11-13"]
  - name: holiday with visa
    prompt: "Отпуск в Японии с 10 по 24 января. Подать на визу до 1 декабря, купить билеты до 15 октября."
    expect: ["2026-10-15", "2026-12-01", "2027-01-10"]
  - name: hiring
    prompt: "Нанимаем двух разработчиков. Вакансия выходит 5 октября, собеседования с 12 по 30 октября, оффер до 6 ноября, выход на работу 1 декабря."
    expect: ["2026-10-05", "2026-10-12", "2026-11-06", "2026-12-01"]
  - name: release
    prompt: "Релиз версии 2.0 15 декабря: код-фриз 1 декабря, бета-тест с 2 по 12 декабря, анонс в блоге в день релиза."
    expect: ["2026-12-01", "2026-12-02", "2026-12-15"]
  - name: wedding
    prompt: "Свадьба 20 июня 2027. Площадку забронировать до 1 декабря, приглашения разослать до 1 апреля, примерка платья 15 мая."
    expect: ["2026-12-01", "2027-04-01", "2027-05-15", "2027-06-20"]
  - name: exam
    prompt: "Экзамен IELTS 28 ноября. Каждую субботу октября пробный тест, разговорная практика по вторникам и четвергам в ноябре."
    expect: ["2026-10-03", "2026-10-31", "2026-11-28"]
  - name: quarter plan
    prompt: "План на 4 квартал: в октябре исследование клиентов, в ноябре прототип, в декабре пилот с тремя клиентами и итоги 25 декабря."
    expect: ["2026-12-25"]
  - name: english plan
    prompt: "Launching a podcast: record the first three episodes by October 31, design the cover by October 20, publish episode one on November 9 and then every Monday."
    expect: ["2026-10-20", "2026-10-31", "2026-11-09", "2026-11-16"]
